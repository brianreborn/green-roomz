name: try-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'config/agents.linux-try.json'
      - 'bin/green-roomz.mjs'
      - 'src/**'
      - 'policies/**'
      - 'Dockerfile'
      - '.github/workflows/try-image.yml'

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
  actions: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:try
            ghcr.io/${{ github.repository }}:try-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
